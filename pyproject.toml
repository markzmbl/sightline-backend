[project]
name = "sightline-backend"
dynamic = ["version"]
description = "The sightline service: ask a workspace's warehouse a question, follow the run live, review what sightline proposes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The core (sightline, at a git rev in [tool.uv.sources]) joins in P3/P4 with the run store
# and the worker. Until then this repo is the API contract and stub routes, and imports
# nothing of it.
dependencies = [
    # the newest release with built-in server-sent events (fastapi.sse)
    "fastapi==0.162.0",
    "pydantic>=2.12",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sightline_backend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sightline_backend"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "sightline_backend.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
